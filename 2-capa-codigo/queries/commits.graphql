query {
  rateLimit {
    cost
    limit
    remaining
    resetAt
  }

  repository(owner: "lyoss-usm", name: "Plataforma-CdRS") {
    repo_id: databaseId
    defaultBranchRef {
      target {
        ... on Commit {
          history(first: 100) {
            pageInfo {
              hasNextPage
              endCursor
            }
            nodes {
              sha: oid
              author {
                user {
                  login # user_login
                }
                date # commit_date
              }
            }
          }
        }
      }
    }
  }
}
